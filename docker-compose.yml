version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: careerbridge-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: careerbridge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careerbridge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerbridge-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=mysql+pymysql://root:@mysql:3306/careerbridge?charset=utf8mb4
      - SECRET_KEY=${SECRET_KEY:-careerbridge_docker_secret_key_development_only}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - ENABLE_DB_FALLBACK=True
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - resume_storage:/app/storage/resumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - careerbridge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: careerbridge-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - careerbridge-net

volumes:
  mysql_data:
    name: careerbridge_mysql_data
  resume_storage:
    name: careerbridge_resume_storage

networks:
  careerbridge-net:
    driver: bridge
